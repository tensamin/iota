[package]
name = "iota-util"
version = "0.1.0"
edition = "2024"

[dependencies]
iota-paths = { path = "../iota-paths" }
iota-identity = { path = "../iota-identity" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "a5efe246771ca176a50a1499e1fea352f0d95dec" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "d222dc19d38aa03f538ab167ca4e4a3b187b9320", features = [
    "crypto"
] }

reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.50.0", features = ["full"] }
sysinfo = "0.38.0"
uuid = { version = "*", features = ["v4"] }
walkdir = "2.5.0"
zip = "6.0.0"
base64 = "0.22.1"
hex = "*"
url = "2"
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
