
[package]
name = "web-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "eef7562be64e77d8c29ba5af6df7596073e3c9f2", features = ["web-server", "crypto", "pipes"] }
bytes = "1"
http = "1"
iota-logger = { path = "../iota-logger" }
iota-identity = { path = "../iota-identity" }
serde = "1"
serde_json = "1"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
