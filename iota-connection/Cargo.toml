[package]
name = "iota-connection"
version = "0.1.0"
edition = "2024"

[features]
relay-fault-injection = ["iota-storage/relay-fault-injection"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
iota-auth = { path = "../iota-auth" }
iota-identity = { path = "../iota-identity" }
iota-logger = { path = "../iota-logger" }
iota-storage = { path = "../iota-storage" }
    iota-util = { path = "../iota-util" }
mtp = { git = "https://github.com/Nonanium/MTP.git", rev = "eef7562be64e77d8c29ba5af6df7596073e3c9f2", features = ["crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.0"
tau-relay-protocol = { git = "https://github.com/TensaminDev/Tau.git", rev = "a2bcda4269b90cce9a49300c9dc0b52e5e9fef6b" }
tau = { git = "https://github.com/TensaminDev/Tau.git", rev = "a2bcda4269b90cce9a49300c9dc0b52e5e9fef6b" }
tokio = { version = "1.50.0", features = ["rt"] }
uuid = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.50.0", features = ["macros", "rt"] }
